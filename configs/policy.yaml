sandbox:
  max_self_heal_attempts: 3
  test_timeout_seconds: 30
  use_docker: false
  strict_docker: false
  docker_image: ai-code-sandbox:py311
  docker_network: none
  docker_memory: 512m
  docker_cpus: "1.0"

context:
  import_depth: 1
  max_file_chars: 50000
  deny_file_globs:
    - "**/.env"
    - "**/*.pem"
    - "**/*.key"
    - "secrets/**"
  keep_comment_keywords:
    - TODO
    - FIXME
    - NOTE
    - IMPORTANT
    - CHÚ Ý
  deny_regex:
    - (?i)api[_-]?key\s*=\s*['\"][^'\"]+['\"]
    - (?i)secret[_-]?key\s*=\s*['\"][^'\"]+['\"]
    - (?i)password\s*=\s*['\"][^'\"]+['\"]
    - -----BEGIN [A-Z ]+ PRIVATE KEY-----

llm:
  mode: provider
  provider: mock
  model: ""
  base_url: ""

patch:
  deny_patterns:
    - "(^|/)\\.env($|\\.)"
    - "(^|/)secrets/"
    - "\\.pem$"
    - "\\.key$"

report:
  final_pass_decision: READY_FOR_HUMAN_REVIEW
  final_fail_decision: NEED_DEVELOPER_REVIEW