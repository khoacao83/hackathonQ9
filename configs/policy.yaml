# AI Code Assembly Line — Pipeline Policy
# Read by orchestrator to enforce enterprise guardrails.

pipeline:
  max_attempts: 3          # Maximum self-healing retries before escalation
  sandbox_isolation: true  # Always patch in temp sandbox, never touch source

graph:
  max_depth: 2             # Multi-hop depth for import graph scan

sandbox:
  test_timeout_seconds: 120
  docker_test_timeout_seconds: 180
  strict_mode: false       # true => when USE_DOCKER=1 and docker unavailable, fail instead of local fallback

context:
  token_estimate_method: "len_div_4"   # estimated_tokens = len(text) // 4
  keep_comment_patterns:               # Comments to preserve during pruning
    - "TODO"
    - "FIXME"
    - "NOTE"
    - "IMPORTANT"
    - "CHÚ Ý"

patch:
  allowed_target_files:    # Only these paths may be patched
    - "app/banking/*.py"
    - "app/inventory/*.py"
  forbidden_files:         # Never modify these
    - "tests/**"
    - "configs/**"

decisions:
  pass_label: "READY_FOR_HUMAN_REVIEW"
  fail_label: "NEED_DEVELOPER_REVIEW"
